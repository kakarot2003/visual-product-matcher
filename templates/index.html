<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Product Matcher</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>Visual Product Matcher</h1>
    <p>Upload an image OR paste a URL to find similar items.</p>

    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <h3>📂 Upload File</h3>
        <p>Click here to select an image</p>
        <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="uploadImage()">
    </div>

    <div style="margin-bottom: 30px;">
        <p>— OR Paste Image Link —</p>
        <input type="text" id="urlInput" placeholder="https://example.com/image.jpg" style="padding: 10px; width: 60%; border-radius: 5px; border: 1px solid #ccc;">
        <button onclick="uploadUrl()" class="btn" style="background: #2c3e50; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Search URL</button>
    </div>

    <div id="loading" class="hidden">
        <p>🔍 Analyzing visual features...</p>
    </div>

    <div id="results" class="hidden">
        <h3>Your Input:</h3>
        <img id="userPreview" class="preview-img" src="">
        
        <h3>Found Similar Products:</h3>
        <div class="results-grid" id="grid"></div>
    </div>
</div>

<script>
    // --- FUNCTION 1: Handle File Upload ---
    async function uploadImage() {
        const input = document.getElementById('fileInput');
        const file = input.files[0];
        if (!file) return;
        
        processRequest('/upload', 'POST', setupFormData(file));
    }

    // --- FUNCTION 2: Handle URL Upload ---
    async function uploadUrl() {
        const url = document.getElementById('urlInput').value;
        if (!url) { alert("Please enter a URL first!"); return; }

        processRequest('/upload-url', 'POST', JSON.stringify({ url: url }), true);
    }

    // --- Shared Helper Functions ---
    function setupFormData(file) {
        const formData = new FormData();
        formData.append('file', file);
        return formData;
    }

    async function processRequest(endpoint, method, body, isJson = false) {
        // Show loading, hide old results
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('results').classList.add('hidden');

        try {
            const headers = isJson ? { 'Content-Type': 'application/json' } : {};
            
            const response = await fetch(endpoint, {
                method: method,
                headers: headers,
                body: body
            });

            const data = await response.json();

            if (data.error) {
                alert(data.error);
                document.getElementById('loading').classList.add('hidden');
                return;
            }

            // Update UI
            // Add a timestamp to force the browser to reload the image if it's the same filename
            document.getElementById('userPreview').src = data.uploaded_image + "?t=" + new Date().getTime();
            
            const grid = document.getElementById('grid');
            grid.innerHTML = ''; 

            data.matches.forEach(product => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${product.image_url}" alt="${product.name}">
                        <h4>${product.name}</h4>
                        <div class="score-badge">${product.score}% Match</div>
                        <p class="price">${product.price || ''}</p>
                    </div>
                `;
            });

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('results').classList.remove('hidden');

        } catch (error) {
            console.error(error);
            alert("An error occurred. Check the console.");
            document.getElementById('loading').classList.add('hidden');
        }
    }
</script>

</body>
</html>
